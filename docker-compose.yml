x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
  S3_ENDPOINT: http://minio:9000

services:
  # --- ИНФРАСТРУКТУРА ---
  db:
    image: postgres:15-alpine
    container_name: spark_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Порт 5432 закрыт снаружи для безопасности
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: spark_redis
    restart: always
    # Порт 6379 закрыт снаружи для безопасности
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: spark_mq
    restart: always
    # Порт 5672 закрыт. Management UI (15672) тоже лучше закрывать на проде
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: spark_s3
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${S3_USER:-admin}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:-miniopassword}
    volumes:
      - minio_data:/data

  # --- ПРИЛОЖЕНИЯ ---
  backend:
    build: ./back-end
    container_name: spark_api
    restart: always
    command: sh -c "alembic upgrade head && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: ./back-end/.env
    environment:
      <<: *common-env
    depends_on:
      - db
      - redis

  bot:
    build: ./back-end
    container_name: spark_bot
    restart: always
    command: python telegram_bot/bot_main.py
    env_file: ./back-end/.env
    environment:
      <<: *common-env
    depends_on:
      - backend

  worker:
    build: ./back-end
    container_name: spark_worker
    restart: always
    command: celery -A core.celery_app worker --loglevel=info
    env_file: ./back-end/.env
    environment:
      <<: *common-env
    depends_on:
      - rabbitmq
      - redis

  beat:
    build: ./back-end
    container_name: spark_beat
    restart: always
    command: celery -A core.celery_app beat --loglevel=info
    env_file: ./back-end/.env
    environment:
      <<: *common-env
    depends_on:
      - worker

volumes:
  pg_data:
  minio_data:
  redis_data:
  rabbitmq_data:
