version: '3.8'

services:
  # --- ИНФРАСТРУКТУРА ---
  db:
    image: postgres:15-alpine
    container_name: spark_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: spark_redis

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: spark_mq
    ports:
      - "15673:15672" # Админка кролика

  minio:
    image: minio/minio
    container_name: spark_s3
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${S3_USER:-admin}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:-miniopassword}
    volumes:
      - minio_data:/data

  # --- ПРИЛОЖЕНИЯ ---
  backend:
    build: ./back-end
    container_name: spark_api
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file: ./back-end/.env
    depends_on:
      - db
      - redis

  bot:
    build: ./back-end
    container_name: spark_bot
    command: python telegram_bot/bot_main.py
    env_file: ./back-end/.env
    depends_on:
      - backend

  worker:
    build: ./back-end
    container_name: spark_worker
    command: celery -A core.celery_app worker --loglevel=info
    env_file: ./back-end/.env
    depends_on:
      - rabbitmq
      - redis

  beat:
    build: ./back-end
    container_name: spark_beat
    command: celery -A core.celery_app beat --loglevel=info
    env_file: ./back-end/.env
    depends_on:
      - worker

volumes:
  pg_data:
  minio_data:
